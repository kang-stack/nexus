# =============================================
# Prod Profile - 鐢熶骇鐜涓棿浠堕厤缃?(閫氳繃鐜鍙橀噺娉ㄥ叆)
# =============================================
spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/icc_cs?rewriteBatchedStatements=true&useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    initial-size: 10
    min-idle: 10
    max-active: 50
    max-wait: 60000
    time-between-eviction-runs-millis: 60000
    min-evictable-idle-time-millis: 300000
    validation-query: SELECT 1
    test-while-idle: true
    test-on-borrow: false
    test-on-return: false
    pool-prepared-statements: true
    max-pool-prepared-statement-per-connection-size: 20
    filters: stat,wall
    connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=3000
    filter:
      stat:
        enabled: true
        db-type: mysql
        log-slow-sql: true
        slow-sql-millis: 1000
        merge-sql: true
      wall:
        enabled: true
        db-type: mysql
    stat-view-servlet:
      enabled: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  redis:
    redisson:
      config: |
        singleServerConfig:
          idleConnectionTimeout: 10000
          connectTimeout: 10000
          timeout: 3000
          retryAttempts: 3
          retryInterval: 1500
          password: ${REDIS_PASSWORD}
          subscriptionsPerConnection: 5
          address: "redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}"
          subscriptionConnectionMinimumIdleSize: 1
          subscriptionConnectionPoolSize: 50
          connectionMinimumIdleSize: 24
          connectionPoolSize: 64
          database: 0
          dnsMonitoringInterval: 5000
        threads: 16
        nettyThreads: 32
        codec: !<org.redisson.codec.JsonJacksonCodec> {}
        transportMode: "NIO"

# MinIO
minio:
  url: ${MINIO_URL:http://localhost:9000}
  accessKey: ${MINIO_ACCESS_KEY}
  secretKey: ${MINIO_SECRET_KEY}
  bucketName: ${MINIO_BUCKET:icc-documents}
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}

# JWT
jwt:
  secret: ${JWT_SECRET}

# XXL-Job
xxl:
  job:
    enabled: true
    admin:
      addresses: ${XXL_ADMIN_ADDRESSES:http://127.0.0.1:8080/xxl-job-admin}
    accessToken: ${XXL_ACCESS_TOKEN:default_token}
    executor:
      appname: ${XXL_EXECUTOR_APPNAME:icc-executor}

logging:
  level:
    cn.cloudcat: INFO
